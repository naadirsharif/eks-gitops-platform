apiVersion: apps/v1
kind: Deployment 
metadata:
  name: it-tools-deployment
  labels: 
    app: it-tools
spec: 
  replicas: 1
  selector: 
    matchLabels: 
      app: it-tools 
  template: 
    metadata: 
      labels: 
        app: it-tools 
    spec: 
      containers: 
      - name: it-tools 
        image: PLACEHOLDER # Gets overwritten by CI/CD  
      ports: 
      - containerPort: 80